# =============================================================================
# ApexOS product-repo denylist gate — TEMPLATE (build-pipeline owned).
#
# Rendered + injected into every product-repo skeleton as
# .github/workflows/apexos-gate.yml by `python -m apexos_harness package`
# (placeholders REPO / ORG / GATE_PATHS_JSON / EXCLUDE_GLOBS_JSON, in
# double-brace form, are substituted at render time).
# PIPELINE-OWNED: never hand-edit the rendered file in a product repo —
# regenerate via the harness (see .apexos/provenance.yaml).
#
# The `gate` JOB ID is the required-status-check name for branch protection
# (coordinated with the branch-protection doc) — DO NOT RENAME IT.
#
# Secrets: BUILD_PIPELINE_TOKEN — an ed25519 SSH private key (deploy key)
# with READ-ONLY access to apexinfosysindia/build-pipeline ONLY. Needed because the
# gate tool + master rename map live in the build-pipeline repo, not in the
# product repos; the key can read nothing else and can write nothing.
# SSH keys are used instead of PATs because GitHub Actions strips recognized
# GitHub token formats (gho_/ghp_) from the runner environment for security.
# Dependabot PRs skip the job (`github.actor` guard): the dependabot actor
# can't read org secrets, so the checkout below would fail red — a skipped
# required check passes branch protection instead.
# =============================================================================
name: apexos-gate

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: apexos-gate-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # per-job grants only (zizmor excessive-permissions)

jobs:
  gate: # job id == required status check name — never rename
    name: denylist gate (os-agent)
    # dependabot's actor can't read org secrets (BUILD_PIPELINE_TOKEN) — the
    # build-pipeline checkout would fail red. Skip instead: skipped required
    # checks pass branch protection, and every human push still gates.
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, apexos-builder]
    permissions:
      contents: read # checkout of the product repo + build-pipeline
    steps:
      - name: checkout os-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: checkout build-pipeline (gate tool + master map)
        env:
          BUILD_PIPELINE_KEY_B64: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          key_file=$(mktemp)
          chmod 600 "$key_file"
          echo "$BUILD_PIPELINE_KEY_B64" | base64 -d | base64 -d > "$key_file"
          GIT_SSH_COMMAND="ssh -i $key_file -o StrictHostKeyChecking=accept-new" \
            git clone --depth=1 git@github.com:apexinfosysindia/build-pipeline.git .build-pipeline
          rm -f "$key_file"

      # NO actions/setup-python. On the self-hosted macOS builder its fallback
      # installer (actions/python-versions setup.sh) resolves the tool cache
      # from AGENT_TOOLSDIRECTORY, which setup-python itself pins to the
      # hosted-image path /Users/runner/hostedtoolcache -- a directory that
      # cannot exist here (the builder runs as 'advait'), so the step dies on
      # `mkdir: /Users/runner: Permission denied`. It also shells out to
      # `sudo installer`, which has no TTY on a runner.
      #
      # Provision from the runner's own interpreter instead. The Linux builder
      # (Ubuntu 24.04) ships python3.12 WITH PyYAML 6.0.1 but WITHOUT pip and
      # WITHOUT ensurepip -- so `python3 -m venv` fails there and there is no
      # pip to recover with. Probe for an interpreter that can already import
      # yaml and only install when none can. Neither builder exposes an
      # unversioned `python`, which the gate steps invoke, so always shim it.
      - name: provision python + gate deps (runner-native interpreter)
        run: |
          set -eu
          py=""
          cand=""
          for c in python3.12 python3.13 python3.11 python3 python; do
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ -z "$cand" ]; then cand="$p"; fi
            if "$p" -c 'import yaml' 2>/dev/null; then py="$p"; break; fi
          done
          if [ -z "$py" ]; then
            if [ -z "$cand" ]; then echo "no python3 on this runner" >&2; exit 1; fi
            py="$cand"
            venv="$RUNNER_TEMP/gatevenv"
            if "$py" -m venv "$venv" 2>/dev/null && "$venv/bin/python" -m pip --version >/dev/null 2>&1; then
              "$venv/bin/python" -m pip install -q --disable-pip-version-check pyyaml
              py="$venv/bin/python"
            elif "$py" -m pip install -q --user --break-system-packages pyyaml 2>/dev/null; then
              :
            else
              "$py" -m pip install -q --user pyyaml
            fi
          fi
          "$py" -c 'import sys, yaml; print(sys.version, "pyyaml", yaml.__version__)'
          shim="$RUNNER_TEMP/pyshim"
          mkdir -p "$shim"
          ln -sf "$py" "$shim/python"
          echo "$shim" >> "$GITHUB_PATH"

      - name: run gate (raw JSON)
        working-directory: .build-pipeline/tools/gate
        env:
          GATE_PATHS: '["."]'
        run: |
          paths=$(python -c "import json, os; print(' '.join(os.path.normpath(os.path.join(os.environ['GITHUB_WORKSPACE'], p)) for p in json.loads(os.environ['GATE_PATHS'])))")
          python -m apexos_gate --map ../../transform/rename-map.yaml --json $paths \
            > "$RUNNER_TEMP/gate.json" || true

      - name: apply exclude globs + fail on violations
        env:
          EXCLUDE_GLOBS: '[]'
        run: |
          python - <<'PY'
          import fnmatch, json, os, sys

          with open(os.path.join(os.environ["RUNNER_TEMP"], "gate.json")) as f:
              gr = json.load(f)
          # Same fnmatch semantics as the harness (adopt.py step 5), plus the
          # surfaces no product-repo run may ever scan: the nested
          # build-pipeline checkout (it CONTAINS the denylist), git metadata,
          # and the pipeline-owned .apexos/ provenance (it records the
          # upstream URL by design — see .apexos/provenance.yaml header).
          excludes = json.loads(os.environ["EXCLUDE_GLOBS"]) + [
              "*/.build-pipeline/*", "*.build-pipeline/*",
              "*/.git/*", "*.git/*",
              "*/.apexos/*", "*.apexos/*",
          ]
          violations = 0
          excluded = 0
          census = {}
          for hit in gr["violations"]:
              if any(fnmatch.fnmatch(hit["path"], g) for g in excludes):
                  excluded += 1
                  continue
              violations += 1
              entry = census.setdefault(hit["term"], {"count": 0, "files": []})
              entry["count"] += 1
              if hit["path"] not in entry["files"]:
                  entry["files"].append(hit["path"])
          print(f"gate: {violations} violations, {len(gr['allowed'])} allowed, "
                f"{excluded} excluded")
          for term, entry in sorted(census.items()):
              print(f"  term {term!r}: {entry['count']} hit(s)")
              for path in entry["files"][:10]:
                  print(f"    {path}")
          sys.exit(1 if violations else 0)
          PY
