name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
env:
  GOLANG_VERSION: "1.26"

jobs:
  golangci:
    name: lint
    runs-on: [self-hosted, apexos-builder]
    steps:
      - uses: actions/checkout@v7.0.1
      # golangci-lint needs a Go toolchain on PATH: it shells out to
      # `go env`/go/packages to load the target packages. The self-hosted
      # builders ship no Go (hosted images did, which is why this job only
      # started failing once it moved off hosted runners), so it died with
      # `exec: "go": executable file not found in $PATH`. Same pin and
      # action version as this repo's build/test workflow, which is green.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
