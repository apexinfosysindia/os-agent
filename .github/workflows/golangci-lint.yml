name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ${{ fromJSON(vars.APEXOS_RUNSON_AMD64 || '["self-hosted","apexos-builder","linux","X64"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
